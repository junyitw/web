        function fromFirestoreFormat(field) {
            if (!field) return null;
            if ('stringValue' in field) return field.stringValue;
            if ('integerValue' in field) return parseInt(field.integerValue, 10);
            if ('doubleValue' in field) return parseFloat(field.doubleValue);
            if ('booleanValue' in field) return field.booleanValue;
            if ('nullValue' in field) return null;
            if ('arrayValue' in field) {
                return (field.arrayValue.values || []).map(fromFirestoreFormat);
            }
            if ('mapValue' in field) {
                const res = {};
                const f = field.mapValue.fields || {};
                for (const k of Object.keys(f)) {
                    res[k] = fromFirestoreFormat(f[k]);
                }
                return res;
            }
            return null;
        }

        function toFirestoreFormat(value) {
            if (value === null || value === undefined) return { nullValue: null };
            if (typeof value === 'boolean') return { booleanValue: value };
            if (typeof value === 'number') return Number.isInteger(value) ? { integerValue: value.toString() } : { doubleValue: value };
            if (typeof value === 'string') return { stringValue: value };
            if (Array.isArray(value)) return { arrayValue: { values: value.map(toFirestoreFormat) } };
            if (typeof value === 'object') {
                const fields = {};
                for (const key of Object.keys(value)) {
                    if (value[key] !== undefined) {
                        fields[key] = toFirestoreFormat(value[key]);
                    }
                }
                return { mapValue: { fields } };
            }
            return { stringValue: String(value) };
        }

            async saveDocRest(path, data) {
                const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/${path}`;
                const firestoreData = { fields: {} };
                for (const key of Object.keys(data)) {

                    }
                }
                const res = await fetch(url, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(firestoreData)
                });
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ` + await res.text());
                }
                return await res.json();
            }

                            const nextClass = newClasses.find(c => c.id === nextClassId);

            // ✅ 僅針對單一班級子文件核對版本（防止同班多人覆蓋），完全不更新學年母文件（維持各班獨立秒存）
            async saveClassData(yearId, classId, data) {
                try {
                    // 1. 僅向該班專屬路徑查詢目前的雲端狀態
                    const currentCloudData = await this.getClassData(yearId, classId);

                        const cloudVersion = currentCloudData._version || 0;
                        
                        // 2. 若雲端版本已被另一台裝置推進，拒絕本次覆蓋
                        
if (cloudVersion > localVersion) {
    return {
        success: false,
        conflict: true,
        cloudData: currentCloudData,
        cloudTime: currentCloudData._lastUpdated || "稍早",
        cloudMentor: currentCloudData.settings?.mentor || "另一位老師"

}

                    const nextVersion = (data._version || 0) + 1;

                        ...data,
                        _version: nextVersion,
                        _lastUpdated: new Date().toLocaleString('zh-TW')
                    };

                    // 3. 本地快取立即寫入
                    localStorage.setItem(`junyi_cache_${yearId}_${classId}`, JSON.stringify(updatedData));

                    await this.saveDocRest(`years/${yearId}/classes/${classId}`, updatedData);

                    return { success: true, newVersion: nextVersion };
                } catch (e) {
                    console.error("雲端存檔失敗", e);

                }

        // --- 輔助演算法：計算單一學生各維度填寫狀態與缺漏錨點 ---
        function checkStudentProgress(student, settings) {
            const data = student.data || {};
            const subjects = settings.subjects || [];
            const sec2Inds = settings.section2Indicators || [];

            // 1. 第二部分：個人整體樣貌
            const s2TextFilled = (data.overall || "").trim().length > 10;
            const s2Inds = data.indicators || [];
            let firstMissingS2Id = null;
            if (!s2TextFilled) {
                firstMissingS2Id = "field-overall-text";
            } else {
                const missingInd = sec2Inds.find(name => {
                    const ind = s2Inds.find(i => i.name === name);
                    return !ind || !ind.score || ind.score <= 0;
                });
                if (missingInd) firstMissingS2Id = `field-s2-ind-${encodeURIComponent(missingInd)}`;
            }
            const s2AllScored = sec2Inds.length === 0 || (sec2Inds.length > 0 && s2Inds.length >= sec2Inds.length && s2Inds.every(i => i.score > 0));
            const section2Complete = s2TextFilled && s2AllScored;

            // 2. 第三/四部分：各課程評量
            let totalSubItems = 0;
            let finishedSubItems = 0;
            let firstMissingSubId = null;

            subjects.forEach((sub, sIdx) => {
                const subData = (data.subGrades && data.subGrades[sub.name]) || { comment: "", indicators: [] };
                totalSubItems += 1;
                const commentOk = (subData.comment || "").trim().length > 5;
                if (commentOk) {
                    finishedSubItems += 1;
                } else if (!firstMissingSubId) {
                    firstMissingSubId = `field-sub-comment-${sIdx}`;
                }

                (sub.indicators || []).forEach((subIndName, iIdx) => {
                    totalSubItems += 1;
                    const found = (subData.indicators || []).find(i => i.name === subIndName);
                    if (found && found.score > 0) {
                        finishedSubItems += 1;
                    } else if (!firstMissingSubId) {
                        firstMissingSubId = `field-sub-${sIdx}-ind-${encodeURIComponent(subIndName)}`;
                    }
                });
            });
            const subjectsRate = totalSubItems > 0 ? Math.round((finishedSubItems / totalSubItems) * 100) : 100;
            const subjectsComplete = subjectsRate >= 95;

            // 3. 第五部分：出席與健康
            const att = data.attendance || {};
            const attFilled = (att.total_days !== "" && att.total_days !== undefined) && (att.actual_days !== "" && att.actual_days !== undefined);
            const healthFilled = (data.health || []).length > 0;
            const healthComplete = attFilled && healthFilled;
            let firstMissingHealthId = null;
            if (!attFilled) {
                firstMissingHealthId = "field-attendance";
            } else if (!healthFilled) {
                firstMissingHealthId = "field-health";
            }

            // 4. 第六部分：導師建議
            const adviceComplete = (data.advice || "").trim().length > 10;
            const firstMissingAdviceId = adviceComplete ? null : "field-advice-text";

            let score = 0;
            if (section2Complete) score += 25; else if (s2TextFilled || s2Inds.some(i => i.score > 0)) score += 12;
            score += Math.round(subjectsRate * 0.45);
            if (healthComplete) score += 15; else if (attFilled || healthFilled) score += 7;
            if (adviceComplete) score += 15;

            return {
                section2Complete,
                s2TextFilled,
                s2AllScored,
                subjectsComplete,
                subjectsRate,
                healthComplete,
                attFilled,
                healthFilled,
                adviceComplete,
                firstMissingS2Id,
                firstMissingSubId,
                firstMissingHealthId,
                firstMissingAdviceId,
                totalPercentage: Math.min(100, score)
            };
        }

        // 4.2.5 衝突比對與版本合併浮動視窗（含文字、各指標勾選等級與備註比對）
const ConflictDiffModal = ({ localData, cloudData, onResolve, onDiscard }) => {
    const [selectedFields, setSelectedFields] = useState({});

    // 分析本地與雲端所有有出入的學生與欄位（文字 + 指標勾選 + 備註）
    const diffList = useMemo(() => {
        const diffs = [];
        const cloudStudents = cloudData?.students || [];
        const localStudents = localData?.students || [];
        const levels = localData?.settings?.levels || ["卓越", "優異", "通過", "加油"];

        const getScoreLabel = (score) => {
            if (!score || score <= 0) return "未評量";
            return levels[score - 1] || `第 ${score} 級`;
        };

        localStudents.forEach(lS => {
            const cS = cloudStudents.find(s => s.id === lS.id) || { data: {} };
            const studentDiffs = [];

            // 1. 個人整體樣貌文字
            if ((lS.data?.overall || "") !== (cS.data?.overall || "")) {
                studentDiffs.push({
                    key: `${lS.id}_overall`,
                    label: "個人整體樣貌描述",
                    localVal: lS.data?.overall || "(空白)",
                    cloudVal: cS.data?.overall || "(空白)",
                    apply: (targetStudent, valType) => {
                        targetStudent.data.overall = valType === 'local' ? (lS.data?.overall || "") : (cS.data?.overall || "");
                    }
                });
            }

            // 2. 個人整體樣貌指標勾選與備註比對
            const lInds = lS.data?.indicators || [];
            const cInds = cS.data?.indicators || [];
            const allS2Names = Array.from(new Set([...lInds.map(i => i.name), ...cInds.map(i => i.name)]));

            allS2Names.forEach(indName => {
                const lInd = lInds.find(i => i.name === indName) || { score: 0, remark: "" };
                const cInd = cInds.find(i => i.name === indName) || { score: 0, remark: "" };

                const isScoreDiff = (lInd.score || 0) !== (cInd.score || 0);
                const isRemarkDiff = (lInd.remark || "") !== (cInd.remark || "");

                if (isScoreDiff || isRemarkDiff) {
                    studentDiffs.push({
                        key: `${lS.id}_s2_ind_${indName}`,
                        label: `個人樣貌指標：【${indName}】`,
                        localVal: `等第：${getScoreLabel(lInd.score)} | 備註：${lInd.remark || "(無)"}`,
                        cloudVal: `等第：${getScoreLabel(cInd.score)} | 備註：${cInd.remark || "(無)"}`,
                        apply: (targetStudent, valType) => {
                            if (!targetStudent.data.indicators) targetStudent.data.indicators = [];
                            const chosen = valType === 'local' ? lInd : cInd;
                            const idx = targetStudent.data.indicators.findIndex(i => i.name === indName);
                            if (idx !== -1) {
                                targetStudent.data.indicators[idx] = { ...chosen };
                            } else {
                                targetStudent.data.indicators.push({ ...chosen, name: indName });
                            }
                        }
                    });
                }
            });

            // 3. 各學科評語與學科指標比對
            const allSubNames = Object.keys({ ...(lS.data?.subGrades || {}), ...(cS.data?.subGrades || {}) });
            allSubNames.forEach(subName => {
                const lSub = lS.data?.subGrades?.[subName] || { comment: "", indicators: [] };
                const cSub = cS.data?.subGrades?.[subName] || { comment: "", indicators: [] };

                // 3.1 學科評語
                if ((lSub.comment || "") !== (cSub.comment || "")) {
                    studentDiffs.push({
                        key: `${lS.id}_sub_${subName}_comment`,
                        label: `${subName} - 總結評語`,
                        localVal: lSub.comment || "(空白)",
                        cloudVal: cSub.comment || "(空白)",
                        apply: (targetStudent, valType) => {
                            if (!targetStudent.data.subGrades) targetStudent.data.subGrades = {};
                            if (!targetStudent.data.subGrades[subName]) targetStudent.data.subGrades[subName] = { indicators: [], comment: "" };
                            targetStudent.data.subGrades[subName].comment = valType === 'local' ? (lSub.comment || "") : (cSub.comment || "");
                        }
                    });
                }

                // 3.2 學科指標細項勾選與備註
                const lSubInds = lSub.indicators || [];
                const cSubInds = cSub.indicators || [];
                const allSubIndNames = Array.from(new Set([...lSubInds.map(i => i.name), ...cSubInds.map(i => i.name)]));

                allSubIndNames.forEach(subIndName => {
                    const lItem = lSubInds.find(i => i.name === subIndName) || { score: 0, remark: "" };
                    const cItem = cSubInds.find(i => i.name === subIndName) || { score: 0, remark: "" };

                    const isSubScoreDiff = (lItem.score || 0) !== (cItem.score || 0);
                    const isSubRemarkDiff = (lItem.remark || "") !== (cItem.remark || "");

                    if (isSubScoreDiff || isSubRemarkDiff) {
                        studentDiffs.push({
                            key: `${lS.id}_sub_${subName}_ind_${subIndName}`,
                            label: `${subName} 指標：【${subIndName}】`,
                            localVal: `等第：${getScoreLabel(lItem.score)} | 備註：${lItem.remark || "(無)"}`,
                            cloudVal: `等第：${getScoreLabel(cItem.score)} | 備註：${cItem.remark || "(無)"}`,
                            apply: (targetStudent, valType) => {
                                if (!targetStudent.data.subGrades) targetStudent.data.subGrades = {};
                                if (!targetStudent.data.subGrades[subName]) targetStudent.data.subGrades[subName] = { indicators: [], comment: "" };
                                const chosen = valType === 'local' ? lItem : cItem;
                                const tSubInds = targetStudent.data.subGrades[subName].indicators || [];
                                const idx = tSubInds.findIndex(i => i.name === subIndName);
                                if (idx !== -1) {
                                    tSubInds[idx] = { ...chosen };
                                } else {
                                    tSubInds.push({ ...chosen, name: subIndName });
                                }
                                targetStudent.data.subGrades[subName].indicators = tSubInds;
                            }
                        });
                    }
                });
            });

            // 4. 導師整體建議
            if ((lS.data?.advice || "") !== (cS.data?.advice || "")) {
                studentDiffs.push({
                    key: `${lS.id}_advice`,
                    label: "導師整體建議",
                    localVal: lS.data?.advice || "(空白)",
                    cloudVal: cS.data?.advice || "(空白)",
                    apply: (targetStudent, valType) => {
                        targetStudent.data.advice = valType === 'local' ? (lS.data?.advice || "") : (cS.data?.advice || "");
                    }
                });
            }

            if (studentDiffs.length > 0) {
                diffs.push({ student: lS, items: studentDiffs });
            }
        });

        return diffs;
    }, [localData, cloudData]);

    const toggleField = (itemKey, source) => {
        setSelectedFields(prev => ({ ...prev, [itemKey]: source }));
    };

    const selectAll = (source) => {
        const next = {};
        diffList.forEach(g => g.items.forEach(i => next[i.key] = source));
        setSelectedFields(next);
    };

    const handleConfirmMerge = () => {
        const finalData = JSON.parse(JSON.stringify(cloudData));
        finalData._version = cloudData._version || 0;

        diffList.forEach(g => {
            const targetStudent = finalData.students.find(s => s.id === g.student.id);
            if (targetStudent) {
                g.items.forEach(item => {
                    const choice = selectedFields[item.key] || 'local';
                    item.apply(targetStudent, choice);
                });
            }
        });
        onResolve(finalData);
    };

    return (

                        <button onClick={() => selectAll('cloud')} className="text-xs bg-emerald-100 text-emerald-800 hover:bg-emerald-200 px-3 py-1.5 rounded-lg font-bold">

                        </button>

                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">

                    ) : (
                        diffList.map(group => (
                            <div key={group.student.id} className="border border-slate-200 rounded-2xl p-5 bg-white shadow-sm">
                                <div className="font-black text-base text-slate-800 mb-3 flex items-center gap-2 border-b pb-2">
                                    <span className="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs">{group.student.no}號</span>
                                    <span>{group.student.name}</span>
                                </div>
                                <div className="space-y-4">
                                    {group.items.map(item => {
                                        const choice = selectedFields[item.key] || 'local';
                                        return (
                                            <div key={item.key} className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                                <div className="text-xs font-bold text-slate-500 mb-2">{item.label}</div>
                                                <div className="grid grid-cols-2 gap-3 text-xs">
                                                    {/* 我的本地修改 */}
                                                    <div 
                                                        onClick={() => toggleField(item.key, 'local')}
                                                        className={`p-3 rounded-xl border-2 cursor-pointer transition-all ${
                                                            choice === 'local' 
                                                                ? 'border-amber-500 bg-amber-50/50 shadow-sm ring-2 ring-amber-400/20' 
                                                                : 'border-slate-200 bg-white hover:border-slate-300'
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-center mb-1 font-bold text-amber-700">
                                                            <span>我的本地修改</span>
                                                            {choice === 'local' && <span className="bg-amber-600 text-white text-[10px] px-1.5 py-0.2 rounded">採用此版</span>}
                                                        </div>
                                                        <div className="whitespace-pre-wrap text-slate-700 line-clamp-4 leading-relaxed font-sans">{item.localVal}</div>
                                                    </div>

                                                    {/* 雲端最新版本 */}
                                                    <div 
                                                        onClick={() => toggleField(item.key, 'cloud')}
                                                        className={`p-3 rounded-xl border-2 cursor-pointer transition-all ${
                                                            choice === 'cloud' 
                                                                ? 'border-emerald-500 bg-emerald-50/50 shadow-sm ring-2 ring-emerald-400/20' 
                                                                : 'border-slate-200 bg-white hover:border-slate-300'
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-center mb-1 font-bold text-emerald-700">
                                                            <span>雲端最新版本</span>
                                                            {choice === 'cloud' && <span className="bg-emerald-600 text-white text-[10px] px-1.5 py-0.2 rounded">採用此版</span>}
                                                        </div>
                                                        <div className="whitespace-pre-wrap text-slate-700 line-clamp-4 leading-relaxed font-sans">{item.cloudVal}</div>

                <div className="p-6 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                    <button onClick={onDiscard} className="text-slate-500 hover:text-slate-800 text-xs font-bold transition">

                        onClick={handleConfirmMerge}

                        <CheckCircle2 size={16} /> 確認所選版本並立即存檔至雲端

    );
};

        // 4.3 StudentEditor Component
        const StudentEditor = ({ student, subjects, section2Config, levels, onChange, readOnly = false, initialTargetSection = null }) => {
            if (!student.data.attendance) {
                student.data.attendance = { total_days: "", official_leave: "", personal_leave: "", sick_leave: "", funeral_leave: "", late_count: "", actual_days: "" };
            }

            useEffect(() => {
                if (!initialTargetSection) return;

                const timer = setTimeout(() => {
                    const targetEl = document.getElementById(initialTargetSection);
                    if (targetEl) {
                        const bigCard = targetEl.closest('[id^="subject-card-"], #editor-section-overall, #editor-section-health, #editor-section-advice');
                        const boxTarget = bigCard || targetEl;

                        boxTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });

                        boxTarget.style.outline = '4px solid #f59e0b';
                        boxTarget.style.outlineOffset = '3px';
                        boxTarget.style.borderRadius = '16px';
                        boxTarget.style.transition = 'all 0.3s ease';

                        if (targetEl.tagName === 'INPUT' || targetEl.tagName === 'TEXTAREA') {
                            targetEl.focus();
                        }

                        setTimeout(() => {
                            boxTarget.style.outline = '';
                            boxTarget.style.outlineOffset = '';
                        }, 3500);
                    }
                }, 250);

                return () => clearTimeout(timer);
            }, [initialTargetSection, student.id]);

            const handleChange = (field, value, nested) => {
                if (readOnly) return;
                const newData = { ...student.data };
                if (nested) {
                    newData[nested][field] = value;
                } else {
                    newData[field] = value;
                }
                onChange({ ...student, data: newData });
            };

            const updateGenericInd = (idx, field, value) => {
                if (readOnly) return;
                const newInds = [...student.data.indicators];
                newInds[idx] = { ...newInds[idx], [field]: value };
                onChange({ ...student, data: { ...student.data, indicators: newInds } });
            };

            const updateSubInd = (subName, idx, field, value) => {
                if (readOnly) return;
                const newSubGrades = { ...student.data.subGrades };
                if (!newSubGrades[subName]) newSubGrades[subName] = { comment: "", indicators: [] };
                const newInds = [...newSubGrades[subName].indicators];
                newInds[idx] = { ...newInds[idx], [field]: value };
                newSubGrades[subName] = { ...newSubGrades[subName], indicators: newInds };
                onChange({ ...student, data: { ...student.data, subGrades: newSubGrades } });
            };

            const updateHealth = (idx, field, val) => {
                if (readOnly) return;
                const newHealth = [...student.data.health];
                newHealth[idx][field] = val;
                onChange({ ...student, data: { ...student.data, health: newHealth } });
            };

            const updateAttendance = (field, val) => {
                if (readOnly) return;
                const newAtt = { ...student.data.attendance, [field]: val };
                onChange({ ...student, data: { ...student.data, attendance: newAtt } });
            };

            const updateSubComment = (subName, val) => {
                if (readOnly) return;
                const newSubGrades = { ...student.data.subGrades };
                if (!newSubGrades[subName]) newSubGrades[subName] = { comment: "", indicators: [] };
                newSubGrades[subName] = { ...newSubGrades[subName], comment: val };
                onChange({ ...student, data: { ...student.data, subGrades: newSubGrades } });
            };

            useEffect(() => {
                if (readOnly) return;

                const currentData = student.data;
                const configS2 = section2Config || [];
                const currentS2Inds = currentData.indicators || [];

                const isS2Mismatch = configS2.length !== currentS2Inds.length || 
                                     configS2.some((name, i) => name !== currentS2Inds[i]?.name);

                const settingSubjectNames = subjects.map(s => s.name);
                const currentStudentSubNames = Object.keys(currentData.subGrades || {});
                
                let isSubMismatch = currentStudentSubNames.length !== settingSubjectNames.length ||
                                    settingSubjectNames.some(name => !currentStudentSubNames.includes(name));

                if (!isSubMismatch) {
                    isSubMismatch = subjects.some(sub => {
                        const studentSubInds = currentData.subGrades[sub.name]?.indicators || [];
                        return sub.indicators.length !== studentSubInds.length ||
                               sub.indicators.some((name, i) => name !== studentSubInds[i]?.name);
                    });
                }

                if (isS2Mismatch || isSubMismatch) {
                    const nextData = { ...currentData }; 

                    if (isS2Mismatch) {
                        nextData.indicators = configS2.map(name => {
                            const existing = currentS2Inds.find(o => o.name === name);
                            return { 
                                name, 
                                score: existing ? existing.score : 0, 
                                remark: existing ? (existing.remark || "") : "" 
                            };
                        });
                    }

                    if (isSubMismatch) {
                        const nextSubGrades = {};
                        subjects.forEach(sub => {
                            const existingSub = currentData.subGrades[sub.name];
                            if (!existingSub) {
                                nextSubGrades[sub.name] = { 
                                    comment: "", 
                                    indicators: sub.indicators.map(n => ({ name: n, score: 0, remark: "" })) 
                                };
                            } else {
                                const currentSubInds = existingSub.indicators || [];
                                nextSubGrades[sub.name] = {
                                    ...existingSub,
                                    indicators: sub.indicators.map(name => {
                                        const existingInd = currentSubInds.find(o => o.name === name);
                                        return { 
                                            name, 
                                            score: existingInd ? existingInd.score : 0, 
                                            remark: existingInd ? (existingInd.remark || "") : "" 
                                        };
                                    })
                                };
                            }
                        });
                        nextData.subGrades = nextSubGrades;
                    }

                    onChange({ ...student, data: nextData });
                }
            }, [subjects, section2Config, student.id, readOnly]);

            return (

                                disabled={readOnly} 
                                value={student.data.overall} 
                                maxLength={LIMITS.OVERALL}
                                onChange={(e) => handleChange('overall', e.target.value)}
                                placeholder="請輸入學期個人整體樣貌描述..."
                            />
                            <CharCounter current={student.data.overall} limit={LIMITS.OVERALL} />
                        </div>
                        
                        <div className="overflow-x-auto mt-4">
                            <table className="w-full text-xs border-collapse border">
                                <thead>
                                    <tr className="bg-slate-100">
                                        <th className="border p-2 text-left text-slate-500 w-40">評量指標項目</th>
                                        {levels.map((l, idx) => <th key={idx} className="border p-2 text-center">{l}</th>)}
                                        <th className="border p-2 text-left text-slate-500">備註 (限{LIMITS.REMARK}字)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {student.data.indicators.map((ind, iIdx) => (
                                        <tr key={iIdx} id={`field-s2-ind-${encodeURIComponent(ind.name)}`} className="hover:bg-slate-50/50 transition">
                                            <td className="border p-2 bg-slate-50 text-slate-700 font-medium w-40">{ind.name}</td>
                                            {levels.map((_, lIdx) => (
                                                <td key={lIdx} className={`border p-2 text-center transition ${!readOnly ? 'cursor-pointer' : ''} ${
                                                    ind.score === lIdx + 1 
                                                        ? 'bg-indigo-600 text-white font-bold' 
                                                        : (!ind.score || ind.score <= 0) 
                                                            ? 'hover:bg-amber-100 bg-amber-50/40 text-amber-600' 
                                                            : ''
                                                }`} onClick={() => updateGenericInd(iIdx, 'score', lIdx + 1)}>
                                                    {ind.score === lIdx + 1 ? '✓' : '○'}
                                                </td>
                                            ))}
                                            <td className="border p-1">
                                                <input 
                                                    type="text" 
                                                    className="w-full p-2 bg-transparent outline-none focus:bg-white transition"
                                                    maxLength={LIMITS.REMARK}
                                                    disabled={readOnly}
                                                    value={ind.remark || ""}
                                                    onChange={(e) => updateGenericInd(iIdx, 'remark', e.target.value)}
                                                />
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="editor-section-subjects" className="space-y-6 scroll-mt-24">
                        {subjects.map((sub, idx) => {
                            const subData = student.data.subGrades[sub.name] || { comment: "", indicators: [] };
                            return (
                                <div key={idx} id={`subject-card-${idx}`} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 transition-all duration-300">
                                    <h4 className="font-bold mb-4 text-emerald-800">{sub.name}</h4>
                                    <div className="relative">
                                        <textarea 
                                            id={`field-sub-comment-${idx}`}
                                            className="w-full border p-4 rounded-xl text-sm mb-1 h-24 bg-slate-50 focus:bg-white transition outline-none disabled:text-slate-600 disabled:bg-slate-100" 
                                            placeholder="輸入學科總結評語..." 
                                            maxLength={LIMITS.SUB_COMMENT}
                                            disabled={readOnly} 
                                            value={subData.comment} 
                                            onChange={(e) => updateSubComment(sub.name, e.target.value)}
                                        />
                                        <CharCounter current={subData.comment} limit={LIMITS.SUB_COMMENT} />
                                    </div>
                                    
                                    <table className="w-full text-xs border-collapse border mt-4">
                                        <thead>
                                            <tr className="bg-slate-50">
                                                <td className="border p-2 font-bold">指標</td>
                                                {levels.map((l, lIdx) => <td key={lIdx} className="border p-2 text-center font-bold">{l}</td>)}
                                                <td className="border p-2 font-bold">備註 (限{LIMITS.REMARK}字)</td>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {subData.indicators.map((ind, iIdx) => (
                                               <tr key={iIdx} id={`field-sub-${idx}-ind-${encodeURIComponent(ind.name)}`}>
                                                    <td className="border p-2 bg-slate-50 text-slate-700 w-40">{ind.name}</td>
                                                    {levels.map((_, lIdx) => (
                                                        <td key={lIdx} className={`border p-2 text-center transition ${!readOnly ? 'cursor-pointer' : ''} ${
                                                            ind.score === lIdx + 1 
                                                                ? 'bg-emerald-600 text-white font-bold' 
                                                                : (!ind.score || ind.score <= 0) 
                                                                    ? 'hover:bg-amber-100 bg-amber-50/40 text-amber-600' 
                                                                    : ''
                                                        }`} onClick={() => updateSubInd(sub.name, iIdx, 'score', lIdx + 1)}>
                                                            {ind.score === lIdx + 1 ? '✓' : '○'}
                                                        </td>
                                                    ))}
                                                    <td className="border p-1">
                                                        <input 
                                                            type="text" 
                                                            className="w-full p-2 bg-transparent outline-none focus:bg-white transition"
                                                            maxLength={LIMITS.REMARK}
                                                            disabled={readOnly}
                                                            value={ind.remark || ""}
                                                            onChange={(e) => updateSubInd(sub.name, iIdx, 'remark', e.target.value)}
                                                        />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            );
                        })}
                    </div>

                    <div id="editor-section-health" className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 scroll-mt-24">

                            <div className="grid grid-cols-7 gap-2 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                {['應出席','公假','事假','病假','喪假','遲到','實際出席'].map((label, idx) => {
                                    const fields = ['total_days', 'official_leave', 'personal_leave', 'sick_leave', 'funeral_leave', 'late_count', 'actual_days'];
                                    const field = fields[idx];
                                    return (
                                        <div key={idx}>
                                            <label className="text-[10px] text-slate-400 block text-center mb-1 font-bold">{label}</label>
                                            <input 
                                                disabled={readOnly} 
                                                className="border-2 border-slate-100 p-2 rounded-lg w-full text-center text-sm disabled:bg-white focus:border-indigo-500 outline-none transition" 
                                                maxLength={5}
                                                value={(student.data.attendance || {})[field] || ""} 
                                                onChange={(e) => updateAttendance(field, e.target.value)} 
                                            />
                                        </div>

                                })}
                            </div>
                        </div>

                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold flex items-center gap-2 text-slate-800">🏥 健康中心紀錄</h3>
                            {!readOnly && (
                                <button className="text-xs bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-lg hover:bg-indigo-100 font-bold transition" onClick={() => { 
                                    const newHealth = [...student.data.health, { term: "", h: "", w: "", vr: "", vl: "", cvr: "", cvl: "" }]; 
                                    onChange({...student, data: {...student.data, health: newHealth}}); 
                                }}>+ 新增測量紀錄</button>

                        </div>
                        <div id="field-health" className="space-y-3">
                            {student.data.health.map((h, hIdx) => (

                                    {!readOnly && (
                                        <button className="absolute -top-2 -right-2 bg-white text-red-400 hover:text-red-600 w-6 h-6 rounded-full shadow-sm border flex items-center justify-center transition" onClick={() => { 
                                            const newHealth = [...student.data.health]; newHealth.splice(hIdx, 1);

                                    <div className="w-full md:w-32"><label className="text-[10px] font-bold text-slate-400 block mb-1">學期</label><input disabled={readOnly} maxLength={10} className="border-2 border-white p-2 rounded-lg w-full text-sm disabled:bg-white outline-none focus:border-indigo-300" placeholder="114-1" value={h.term} onChange={(e) => updateHealth(hIdx, 'term', e.target.value)} /></div>
                                    <div className="w-20"><label className="text-[10px] text-slate-400 block mb-1 font-bold">身高</label><input disabled={readOnly} maxLength={5} className="border-2 border-white p-2 rounded-lg w-full text-center text-sm disabled:bg-white outline-none focus:border-indigo-300" value={h.h} onChange={(e) => updateHealth(hIdx, 'h', e.target.value)} /></div>
                                    <div className="w-20"><label className="text-[10px] text-slate-400 block mb-1 font-bold">體重</label><input disabled={readOnly} maxLength={5} className="border-2 border-white p-2 rounded-lg w-full text-center text-sm disabled:bg-white outline-none focus:border-indigo-300" value={h.w} onChange={(e) => updateHealth(hIdx, 'w', e.target.value)} /></div>
                                    <div className="flex gap-1 bg-white p-1.5 rounded-lg border-2 border-white shadow-sm">

                                       <div className="w-16"><label className="text-[10px] text-slate-400 block text-center font-bold">裸視(左)</label><input disabled={readOnly} maxLength={3} className="bg-slate-50 p-1 rounded w-full text-center text-xs disabled:bg-white outline-none" value={h.vl} onChange={(e) => updateHealth(hIdx, 'vl', e.target.value)} /></div>

        // 4.4 SwipeableStudentItem Component
        const SwipeableStudentItem = ({ student, onDelete, isDeleting }) => {
            const [offsetX, setOffsetX] = useState(0);
            const [isSwiped, setIsSwiped] = useState(false);
            const startX = useRef(0);
            const isDragging = useRef(false);

            const handlePointerDown = (e) => {
                if (isDeleting) return;
                startX.current = e.clientX;
                isDragging.current = true;
                e.currentTarget.setPointerCapture(e.pointerId);
            };

            const handlePointerMove = (e) => {
                if (!isDragging.current) return;
                const diff = e.clientX - startX.current;
                if (diff < 0) {
                    setOffsetX(Math.max(diff, -100));
                } else if (isSwiped && diff > 0) {
                    setOffsetX(Math.min(-80 + diff, 0));
                }
            };

            const handlePointerUp = (e) => {
                isDragging.current = false;
                e.currentTarget.releasePointerCapture(e.pointerId);
                if (offsetX < -50) {
                    setOffsetX(-80);
                    setIsSwiped(true);
                } else {
                    setOffsetX(0);
                    setIsSwiped(false);
                }
            };

            return (
                <div className="relative h-16 mb-3 overflow-hidden rounded-xl select-none group">
                    <div className="absolute inset-y-0 right-0 w-20 bg-red-600 flex flex-col items-center justify-center text-white cursor-pointer active:bg-red-700 transition-colors" onClick={() => onDelete(student.id, student.name)}>

                        <span className="text-[10px] font-bold">確認刪除</span>
                    </div>
                    <div onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} style={{ transform: `translateX(${offsetX}px)` }} className={`absolute inset-0 bg-white border border-slate-200 rounded-xl flex items-center justify-between p-4 shadow-sm transition-transform duration-200 ease-out touch-pan-y ${isSwiped ? 'border-red-200' : 'group-hover:border-indigo-200'}`}>
                        <div className="flex items-center gap-4 pointer-events-none">
                            <GripVertical size={16} className="text-slate-300" />
                            <span className="bg-indigo-50 w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold border border-indigo-100 text-indigo-600">{student.no}</span>
                            <span className="font-bold text-slate-700 text-base">{student.name}</span>
                        </div>
                        <div className="flex items-center gap-2 pointer-events-none">
                            {isDeleting ? <div className="flex items-center gap-2 text-indigo-500"><Loader2 size={16} className="animate-spin" /><span className="text-xs font-bold">刪除中...</span></div> : <div className={`flex items-center gap-1 text-slate-300 transition-opacity ${isSwiped ? 'opacity-0' : 'opacity-0 group-hover:opacity-100'}`}><span className="text-[10px]">左滑管理</span><ChevronRight size={14} /></div>}
                        </div>
                    </div>
                </div>
            );
        };

        // 4.5 進度總覽矩陣組件 (ProgressMatrix)

                            </p>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right">

                            <tbody className="divide-y divide-slate-100">

                                            <td className="p-3 text-center font-mono font-bold text-slate-400">{student.no}</td>

            const [deleteConfirmModal, setDeleteConfirmModal] = useState({show: false, yearId: '', yearName: ''});

                setLoading(true);
                const yearList = await cloudService.getAllYears();
                setYears(yearList);
                if (yearList.length > 0) {
                    if (targetYearId && yearList.some(y => y.id === targetYearId)) {
                        setSelectedYearId(targetYearId);
                    } else if (!selectedYearId || !yearList.some(y => y.id === selectedYearId)) {
                        setSelectedYearId(yearList[yearList.length - 1].id);
                    }
                } else {
                    setSelectedYearId('');
                }
                setLoading(false);
            };

            const selectedYear = useMemo(() => years.find(y => y.id === selectedYearId), [years, selectedYearId]);

            const filteredStudents = useMemo(() => {
                if (!searchTerm.trim()) return [];
                const term = searchTerm.toLowerCase();
                const results = [];
                years.forEach(year => {
                    (year.classes || []).forEach(cls => {
                        (cls.students || []).forEach(std => {
                            if (std.name.includes(term) || std.no.includes(term)) {
                                results.push({ student: std, classId: cls.id, className: cls.name, yearId: year.id });
                            }
                        });
                    });
                });
                return results;
            }, [years, searchTerm]);

            const handleAddYear = async () => {
                if (!newYearName.trim()) return;
                setProcessingYear(true);
                try {
                    const success = await cloudService.addYear(newYearName);
                    if (success) {
                        setNewYearName('');
                        setAddYearModal(false);
                        await loadData();
                        alert(`✅ 成功建立「${newYearName}」！導師姓名與學生名單已自動晉升至對應年級。`);
                    } else {
                        alert("⚠️ 建立失敗，請檢查連線設定。");
                    }
                } catch (error) {
                    alert("❌ 發生未預期的錯誤");
                } finally {
                    setProcessingYear(false);
                }
            };

            const requestDeleteYear = (id, name) => setDeleteConfirmModal({ show: true, yearId: id, yearName: name });

            const confirmDeleteYear = async () => {
                setDeletingYear(true);
                const { yearId } = deleteConfirmModal;
                try {
                    const success = await cloudService.deleteYear(yearId);
                    if (success) {
                        if (selectedYearId === yearId) setSelectedYearId('');
                        await loadData();
                        setDeleteConfirmModal({ show: false, yearId: '', yearName: '' });
                    } else {
                        alert("❌ 刪除失敗：無法同步至雲端，請重試。");
                    }
                } catch (error) {
                    alert("❌ 刪除時發生錯誤。");
                } finally {
                    setDeletingYear(false);
                }

            const handlePasswordReset = async () => {
                await cloudService.updatePassword(resetModal.username, newPass);

            const handleClassUpdate = async () => {
                if (!selectedYearId || !editModal.classId) return;
                await cloudService.updateClassMetadata(selectedYearId, editModal.classId, editModal.name, editModal.mentor);

            const handleBulkImport = async () => {
                const currentClass = await cloudService.getClassData(selectedYearId, importModal.classId);
                if(!currentClass) return;
                const lines = bulkNames.split('\n').map(l => l.trim()).filter(l => l);
                let nextNo = (currentClass.students || []).length + 1;

                    id: Math.random().toString(36).substr(2, 9),

                    }

                                                const text = await file.text();

                                                setLoading(true);
                                                await cloudService.importLegacyDb(parsed);

                                            try {
                                                await cloudService.exportDatabase();
                                                alert("✅ 備份檔已成功下載至您的電腦！");
                                            } catch (err) {
                                                alert("❌ 備份失敗：" + err.message);
                                            }
                                        }}
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md active:scale-95"
                                    >
                                        <Cloud size={16} /> 匯出全校備份 JSON
                                    </button>
                                </>
                            )}

                            <button onClick={onLogout} className="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-xl text-sm transition font-bold shadow">登出</button>
                        </div>
                    </nav>
                    <main className="max-w-6xl mx-auto p-8">
                        <div className="mb-8 relative z-40">
                            <div className="flex items-center bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
                                <Search className="text-slate-400 ml-2" size={20} />
                                <input type="text" placeholder="搜尋全校學生 (可跨學年搜尋)" className="w-full p-2 outline-none text-slate-700 font-medium" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>

useEffect(() => {

}, [data, dirty, yearId, classId]);

// 視窗離開或重整時的雙重保障
useEffect(() => {
    const handleBeforeUnload = () => {
        if (dirty && currentDataRef.current) {
            localStorage.setItem(
                `junyi_unsaved_draft_${yearId}_${classId}`,
                JSON.stringify(currentDataRef.current)
            );
        }
    };

    window.addEventListener("beforeunload", handleBeforeUnload);
    return () => {
        window.removeEventListener("beforeunload", handleBeforeUnload);
    };
}, [dirty, yearId, classId]);

            useEffect(() => {

                        setViewMode(userRole === UserRole.VIEWER || isHistoryReadOnly ? 'preview' : 'editor'); 
                    }
                }
            }, [data, initialStudentId, userRole, isHistoryReadOnly]);

            const calculatePrintEnginePages = () => {
                if (!data || !data.students) return;
                setMeasuring(true);

                const newOddMap = {};
                const studentList = data.students;

                studentList.forEach((student) => {
                    const sheetEl = studentSheetRefs.current[student.id];

                    if (sheetEl) {
                        const containerWidth = sheetEl.offsetWidth || 793;
                        const pageMaxHeight = containerWidth * 1.28;
                        const cards = Array.from(sheetEl.querySelectorAll('.print-card'));

                        let currentPageHeight = 0;
                        let pageCount = 1;

                        cards.forEach((card) => {
                            const rect = card.getBoundingClientRect();
                            const style = window.getComputedStyle(card);
                            const marginTop = parseFloat(style.marginTop) || 0;
                            const marginBottom = parseFloat(style.marginBottom) || 0;
                            const cardTotalHeight = rect.height + marginTop + marginBottom;

                            if (cardTotalHeight <= 0) return;

                            if (cardTotalHeight > pageMaxHeight) {
                                if (currentPageHeight > 0) pageCount++;
                                const extraPages = Math.ceil(cardTotalHeight / pageMaxHeight);
                                pageCount += (extraPages - 1);
                                currentPageHeight = cardTotalHeight % pageMaxHeight;
                            } else if (currentPageHeight + cardTotalHeight > pageMaxHeight) {
                                pageCount++;
                                currentPageHeight = cardTotalHeight;
                            } else {
                                currentPageHeight += cardTotalHeight;
                            }
                        });

                        newOddMap[student.id] = {
                            pages: pageCount,
                            isOdd: pageCount % 2 !== 0
                        };
                    } else {
                        newOddMap[student.id] = { pages: 8, isOdd: false };
                    }
                });

                setOddPageMap(newOddMap);
                setMeasuring(false);
            };

            useLayoutEffect(() => {
                if (viewMode === 'batch-preview') {
                    const timer = setTimeout(() => {
                        calculatePrintEnginePages();
                    }, 350);
                    return () => clearTimeout(timer);

                setOddPageMap(prev => {
                    const current = prev[studentId] || { isOdd: false, pages: 8 };
                    const nextIsOdd = !current.isOdd;
                    return {
                        ...prev,
                        [studentId]: {
                            ...current,
                            pages: nextIsOdd ? (current.pages % 2 === 0 ? current.pages + 1 : current.pages) : (current.pages % 2 !== 0 ? current.pages + 1 : current.pages),

                        }

                });
            };

                    setData(cloudResult);

                    setDirty(false); 
                    setLastSaved(new Date().toLocaleTimeString());
                    alert("✅ 資料已成功同步至 Firestore 雲端資料庫！"); 
                } else if (result.conflict) {
        // 🔥 存檔衝突：直接啟動比對視窗，比對本地與雲端資料
        setDiffConflict({
            local: data,
            cloud: result.cloudData
        });
    } else { 
        alert("❌ 儲存失敗，請檢查網路連線或專案設定：" + (result.error || "")); 
    }
};

            const handleStudentSelect = (idx, section = null) => {

                        <div className="print-container fixed inset-0 z-[100] bg-slate-900/98 overflow-y-auto backdrop-blur-md">
                            <div className="no-print max-w-5xl mx-auto my-6 bg-slate-800 text-white p-6 rounded-3xl shadow-xl border border-slate-700 space-y-4">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-700 pb-4">
                                    <div>
                                        <h4 className="font-bold flex items-center gap-2 text-emerald-400 text-lg">
                                            <Printer size={22} /> 全班評量冊批次列印模式（共 {(data.students || []).length} 位學生）
                                        </h4>
                                        <p className="text-xs text-slate-300 mt-1">
                                            系統已採用「實體卡片斷頁模擬技術」，**僅在奇數頁（例如 9 頁）學生末端補印 1 頁空白背面**，確保全班每位同學封面絕對印在新紙張的正面！
                                        </p>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl font-black shadow-md flex items-center gap-2 active:scale-95 transition text-sm">
                                            <Printer size={18} /> 立即列印全班 / 存為 PDF
                                        </button>
                                        <button onClick={() => setViewMode('welcome')} className="bg-slate-700 hover:bg-slate-600 text-white px-5 py-3 rounded-xl font-bold transition text-sm">
                                            關閉預覽
                                        </button>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center justify-between gap-4 pt-1">
                                    <div className="flex items-center gap-3">
                                        <label className="flex items-center gap-2 text-xs text-amber-300 font-bold cursor-pointer select-none bg-slate-900 px-3.5 py-2 rounded-xl border border-amber-400/40 hover:bg-slate-950 transition">
                                            <input 
                                                type="checkbox" 
                                                checked={duplexPadding} 
                                                onChange={(e) => setDuplexPadding(e.target.checked)} 
                                                className="w-4 h-4 rounded text-indigo-600 accent-indigo-500 cursor-pointer"
                                            />
                                            啟用智慧雙面列印防沾黏（奇數頁自動補印 1 頁空白背面）
                                        </label>
                                        <button 
                                            onClick={calculatePrintEnginePages} 
                                            className="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl flex items-center gap-1.5 font-bold transition border border-slate-600"
                                            title="重新以卡片斷頁模型計算頁數"
                                        >
                                            <RefreshCw size={13} className={measuring ? "animate-spin text-indigo-400" : ""} /> 重新偵測全班頁數
                                        </button>
                                    </div>
                                    <span className="text-[11px] text-slate-400">
                                        💡 小提示：若特定學生剛好在換頁臨界點，可在下方名冊直接點擊標籤微調補白！
                                    </span>
                                </div>

                                {/* 即時學生頁數清單與手動切換開關 (讓導師 100% 放心) */}
                                {duplexPadding && (
                                    <div className="bg-slate-900/80 p-3 rounded-2xl border border-slate-700/80">
                                        <div className="text-[11px] font-bold text-slate-400 mb-2 flex items-center gap-2">
                                            <span>全班每生實際頁數狀態檢核表：</span>
                                            <span className="text-amber-400 font-normal">（橘色為奇數頁將自動補白、綠色為偶數頁無需補白，點擊可手動切換）</span>
                                        </div>
                                        <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar p-1">
                                            {(data.students || []).map((s, sIdx) => {
                                                const isLast = sIdx === (data.students || []).length - 1;
                                                const info = oddPageMap[s.id] || { isOdd: false, pages: 8 };
                                                return (
                                                    <button
                                                        key={s.id}
                                                        onClick={() => !isLast && toggleStudentParity(s.id)}
                                                        disabled={isLast}
                                                        className={`text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 transition border ${
                                                            isLast
                                                                ? 'bg-slate-800 text-slate-500 border-slate-700 cursor-default'
                                                                : info.isOdd
                                                                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 hover:bg-amber-500/30 ring-1 ring-amber-500/50'
                                                                    : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 hover:bg-emerald-500/30'
                                                        }`}
                                                        title={isLast ? '最後一位學生無需補白' : '點擊手動切換此生是否補白'}
                                                    >
                                                        <span>{s.no}. {s.name}</span>
                                                        <span className="font-mono text-[10px] opacity-80">({info.pages}頁)</span>
                                                        {!isLast && (
                                                            <span className="text-[10px] underline ml-0.5">
                                                                {info.isOdd ? '補白頁' : '不補'}
                                                            </span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="w-[210mm] mx-auto bg-white min-h-screen shadow-2xl my-6 print:m-0 print:w-full rounded-sm overflow-hidden divide-y-4 divide-dashed divide-slate-300 print:divide-y-0">
                                {(data.students || []).map((studentItem, sIdx) => {
    const isLastStudent = sIdx === (data.students || []).length - 1;
    const info = oddPageMap[studentItem.id] || { isOdd: false, pages: 8 };
    // 關鍵：只要該生被標記為奇數頁 (isOdd === true)，且不是最後一人，立刻插入一張 A4 實體空白頁
    const shouldFillBlank = duplexPadding && !isLastStudent && info.isOdd;

    return (
        <React.Fragment key={studentItem.id}>
            <PrintPreview 
                student={studentItem} 
                classSettings={data.settings} 
                innerRef={(el) => studentSheetRefs.current[studentItem.id] = el}
            />
            
            {/* 智慧補齊：實體空白背面 */}
            {shouldFillBlank && (
                <div className="print-blank-filler-sheet p-[6.7mm] bg-white flex flex-col justify-end text-slate-300 text-xs">
                    <div className="no-print border-2 border-dashed border-amber-300/80 rounded-2xl p-6 text-center text-amber-700 font-bold bg-amber-50 shadow-inner">
                        📄 【{studentItem.name}】為奇數頁，系統已為其補上 1 頁空白背面（確保下一位同學從正面開始）
                    </div>
                </div>
            )}
        </React.Fragment>
    );
})}
                            </div>

                            <div className="no-print fixed bottom-10 right-10 flex gap-4">
                                <button onClick={() => window.print()} className="bg-emerald-600 text-white px-10 py-4 rounded-full font-black shadow-2xl hover:bg-emerald-500 transition-all scale-110 flex items-center gap-2">
                                    <Printer size={20} /> 🖨️ 列印全班 / 匯出 PDF
                                </button>
                                <button onClick={() => setViewMode('welcome')} className="bg-slate-800 text-white px-8 py-4 rounded-full font-black shadow-xl hover:bg-slate-700 transition-all">
                                    返回工作台
                                </button>
                            </div>
                        </div>
                    )}
{/* ★ 存檔衝突比對與版本確認浮動視窗 ★ */}
{diffConflict && (
    <ConflictDiffModal 
        localData={diffConflict.local}
        cloudData={diffConflict.cloud}
        onResolve={async (mergedData) => {
            setDiffConflict(null);
            setData(mergedData);
            // 立即執行存檔寫入雲端
            setSaving(true);
            const saveRes = await cloudService.saveClassData(yearId, classId, mergedData);
            setSaving(false);
            if (saveRes.success) {
                setData(prev => ({ ...prev, _version: saveRes.newVersion }));
                setDirty(false);
                setLastSaved(new Date().toLocaleTimeString());
                alert("✅ 已成功依您的決定合併並完成雲端存檔！");
            } else {
                alert("❌ 合併儲存失敗：" + saveRes.error);
            }
        }}
        onDiscard={() => setDiffConflict(null)}
    />
)}                </>
            );
        };

        // 4.8 TeacherAutoLoader (完整溯源演算法與有效學年過濾版)
        const TeacherAutoLoader = ({ user, onLogout }) => {
            const [years, setYears] = useState([]);
            const [selectedYearId, setSelectedYearId] = useState(null);
            const [latestYearId, setLatestYearId] = useState(null);

            useEffect(() => { 
                const initYears = async () => { 
                    try {
                        const list = await cloudService.getAllYears(); 
                        if (list && list.length > 0) {
                            const latest = list[list.length - 1].id;
                            setYears(list);
                            setLatestYearId(latest);
                            setSelectedYearId(latest);
                        }
                    } catch (err) {
                        console.warn("背景讀取學年清單異常", err);
                    }
                }; 
                initYears(); 
            }, []);

            const getTracedClassId = (targetYearId) => {
                if (!targetYearId || years.length === 0) return user.classId;
                if (targetYearId === latestYearId) return user.classId;

                const latestYear = years.find(y => y.id === latestYearId);
                const targetYear = years.find(y => y.id === targetYearId);
                if (!latestYear || !targetYear) return null;

                const currentClass = (latestYear.classes || []).find(c => c.id === user.classId);
                const latestIdx = years.findIndex(y => y.id === latestYearId);
                const targetIdx = years.findIndex(y => y.id === targetYearId);
                const yearDiff = latestIdx - targetIdx;

                const match = user.classId.match(/^class(\d+)$/);
                if (match) {
                    const currentGradeNum = parseInt(match[1], 10);
                    if (currentGradeNum <= 6 && (currentGradeNum - yearDiff) <= 0) {
                        return null;
                    }
                }

                if (!currentClass || (currentClass.students || []).length === 0) {
                    if (match) {
                        const targetGradeNum = parseInt(match[1], 10) - yearDiff;
                        return targetGradeNum > 0 ? `class${targetGradeNum}` : null;
                    }
                    return null;
                }

                const currentStudentNames = new Set((currentClass.students || []).map(s => s.name));
                const currentStudentIds = new Set((currentClass.students || []).map(s => s.id));

                let bestClassId = null;
                let maxMatchCount = 0;

                (targetYear.classes || []).forEach(cls => {
                    let matchCount = 0;
                    (cls.students || []).forEach(s => {
                        if (currentStudentIds.has(s.id) || currentStudentNames.has(s.name)) {
                            matchCount++;
                        }
                    });
                    if (matchCount > maxMatchCount) {
                        maxMatchCount = matchCount;
                        bestClassId = cls.id;
                    }
                });

                return maxMatchCount > 0 ? bestClassId : null;
            };

            const accessibleYears = useMemo(() => {
                return years.filter(y => {
                    if (y.id === latestYearId) return true;
                    return getTracedClassId(y.id) !== null;
                });
            }, [years, latestYearId, user.classId]);

            const targetClassId = useMemo(() => {
                return getTracedClassId(selectedYearId);
            }, [years, selectedYearId, latestYearId, user.classId]);

            const handleSelectYear = (newYearId) => {
                if (newYearId !== latestYearId) {
                    const traced = getTracedClassId(newYearId);
                    if (!traced) {
                        const targetYearObj = years.find(y => y.id === newYearId);
                        const yearLabel = targetYearObj ? targetYearObj.name : "該學年度";
                        alert(`⚠️ 無法切換：本班學生在「${yearLabel}」尚未入學，查無歷史資料。`);
                        return;
                    }
                }
                setSelectedYearId(newYearId);
            };

            if (!selectedYearId || !latestYearId) {
                return <div className="h-screen flex items-center justify-center font-bold text-slate-400 bg-slate-900">載入學年資料中...</div>;
            }

            const isHistoryReadOnly = selectedYearId !== latestYearId;

            return (
                <ClassroomEditor 
                    yearId={selectedYearId} 
                    classId={targetClassId} 
                    userRole={UserRole.TEACHER} 
                    onLogout={onLogout} 
                    readOnly={isHistoryReadOnly} 
                    availableYears={accessibleYears}
                    currentYearId={latestYearId}
                    onSelectYear={handleSelectYear}
                />
            );
        };

        // 4.9 App Component
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [adminViewClassId, setAdminViewClassId] = useState(null);
            const [adminViewYearId, setAdminViewYearId] = useState(null);
            const [targetStudentId, setTargetStudentId] = useState(undefined);

            useEffect(() => { checkAuth(); }, []);

            const checkAuth = async () => {
                const currentUser = await cloudService.getCurrentUser();
                setUser(currentUser);
                setLoading(false);
            };

            const handleLogout = async () => {
                await cloudService.logout();
                setUser(null);
                setAdminViewClassId(null);
                setAdminViewYearId(null);
            };

            const handleViewClass = (yearId, classId) => { setAdminViewYearId(yearId); setAdminViewClassId(classId); setTargetStudentId(undefined); };
            const handleViewStudent = (yearId, classId, studentId) => { setAdminViewYearId(yearId); setAdminViewClassId(classId); setTargetStudentId(studentId); };

            if (loading) return <div className="h-screen flex items-center justify-center bg-slate-900 text-white">載入中...</div>;
            if (!user) return <Login onLogin={setUser} />;

            if (user.role === UserRole.ADMIN || user.role === UserRole.VIEWER) {
                if (adminViewYearId && adminViewClassId) {
                    return <ClassroomEditor yearId={adminViewYearId} classId={adminViewClassId} userRole={user.role} onLogout={handleLogout} onBackToAdmin={() => { setAdminViewClassId(null); setAdminViewYearId(null); }} readOnly={user.role === UserRole.VIEWER} initialStudentId={targetStudentId} />;
                }
                return <AdminDashboard onLogout={handleLogout} onViewClass={handleViewClass} onViewStudent={handleViewStudent} userRole={user.role} />;
            }

            if (user.role === UserRole.TEACHER && user.classId) {
                return <TeacherAutoLoader user={user} onLogout={handleLogout} />;
            }
            return <div>系統狀態錯誤</div>;
        };

        // --- 5. Mount App ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
