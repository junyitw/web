<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>均一國小部課後晚接記錄系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 自訂淡入上浮動畫 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        
        /* 隱藏捲軸但保留捲動功能 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 輔助組件：Toast 提示 ---
        const Toast = ({ message, onClose }) => {
          useEffect(() => {
            const timer = setTimeout(onClose, 3000);
            return () => clearTimeout(timer);
          }, [onClose]);

          return (
            <div className="fixed bottom-6 right-6 bg-gray-800 text-white px-6 py-4 rounded-xl shadow-2xl z-50 animate-fade-in-up flex items-center gap-3">
              <span className="text-xl">🔔</span>
              <span className="font-medium">{message}</span>
            </div>
          );
        };

        // --- 載入中遮罩 ---
        const LoadingOverlay = ({ message }) => (
          <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex flex-col items-center justify-center z-50 animate-fade-in-up">
            <div className="bg-white px-8 py-6 rounded-2xl shadow-2xl flex items-center gap-4 border border-gray-100">
              <div className="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
              <span className="font-bold text-gray-700 text-lg">{message || "資料同步中，請稍候..."}</span>
            </div>
          </div>
        );

        // --- SVG 圖示庫 ---
        const Icons = {
          Teacher: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>,
          Office: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>,
          Guard: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
          Admin: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><path d="M14 8h.01"/><path d="M14 12h.01"/><path d="M14 16h.01"/></svg>,
          Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
          Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
          LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
          Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
          User: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
          Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        };

        const getTodayDate = () => new Date().toISOString().split('T')[0];
        const getCurrentTime = () => {
          const now = new Date();
          return now.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false });
        };

        const OperationalView = ({ currentRoleTitle, records, onAddRecord, onCheckout, onDelete, onUpdate, gasUrl, showToast }) => {
          const [formData, setFormData] = useState({ gradeClass: '', seatNumber: '', studentName: '', notes: '' });
          const [selectedStudent, setSelectedStudent] = useState(null);
          const [signature, setSignature] = useState('');
          const [otherName, setOtherName] = useState(''); // 🔥 專門用來處理「其他」的自訂輸入
          const [editingStudent, setEditingStudent] = useState(null);

          // 建立 DOM 參考以便按 Enter 時跳轉游標
          const notesRef = React.useRef(null);

          const today = getTodayDate();
          
          // 🔥 篩選今日等待中的學生，並加入「依班級與座號」排序
          const waitingStudents = records
            .filter(r => r.status === 'waiting' && r.date === today)
            .sort((a, b) => {
              // 1. 先比對班級
              const classA = String(a.gradeClass || '');
              const classB = String(b.gradeClass || '');
              if (classA !== classB) {
                return classA.localeCompare(classB, 'zh-Hant', { numeric: true });
              }
              // 2. 班級相同時，比對座號 (若資料中有 seatNumber 欄位)
              const seatA = Number(a.seatNumber || 0);
              const seatB = Number(b.seatNumber || 0);
              return seatA - seatB;
            });

          // 查詢學生姓名函數
          const handleSeatNumberLookup = async () => {
            if (!formData.gradeClass || !formData.seatNumber) return;
            try {
              const res = await fetch(`${gasUrl}?action=lookup&gradeClass=${formData.gradeClass}&seatNumber=${formData.seatNumber}`);
              const result = await res.json();
              if (result.status === 'success' && result.data && result.data.name) {
                setFormData(prev => ({ ...prev, studentName: result.data.name }));
                showToast(`✅ 已帶出學生：${result.data.name}`);
                // 查詢成功後自動將游標跳轉到備註欄位
                if (notesRef.current) notesRef.current.focus();
              } else {
                showToast('⚠️ 找不到對應的學生，請檢查班級與座號');
                setFormData(prev => ({ ...prev, studentName: '' }));
              }
            } catch (err) {
              console.error(err);
              showToast('❌ 查詢學生失敗');
            }
          };

          // 🔥 功能 1：支援在座號欄位按下 Enter 鍵直接觸發查詢並跳轉
          const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              handleSeatNumberLookup();
            }
          };

          const handleSubmit = (e) => {
            e.preventDefault();
            if (!formData.gradeClass || !formData.studentName) return;
            onAddRecord(formData, currentRoleTitle);
            setFormData({ gradeClass: '', seatNumber: '', studentName: '', notes: '' });
          };

          const handleSaveEdit = (e) => {
            e.preventDefault();
            onUpdate(editingStudent);
            setEditingStudent(null);
          };

          return (
            <div className="max-w-5xl mx-auto space-y-8 animate-fade-in-up pb-10">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                  <span className="bg-emerald-100 text-emerald-600 p-2 rounded-lg"><Icons.User /></span>
                  新增晚接學生登記
                </h2>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-sm font-semibold text-gray-600 mb-1">班級</label>
                      <input type="text" placeholder="例: 301" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 outline-none" value={formData.gradeClass} onChange={e => setFormData({...formData, gradeClass: e.target.value})} required />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-600 mb-1">座號 (可按 Enter)</label>
                      <input 
                        type="text" 
                        placeholder="例: 5" 
                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 outline-none" 
                        value={formData.seatNumber} 
                        onChange={e => setFormData({...formData, seatNumber: e.target.value})} 
                        onBlur={handleSeatNumberLookup} 
                        onKeyDown={handleKeyDown}
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-600 mb-1">姓名 (自動帶出)</label>
                      <input type="text" placeholder="自動帶出" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl bg-gray-50 font-bold outline-none" value={formData.studentName} readOnly required />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-gray-600 mb-1">備註 (選填)</label>
                      <input 
                        type="text" 
                        ref={notesRef}
                        placeholder="轉交辦公室/原因" 
                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 outline-none" 
                        value={formData.notes} 
                        onChange={e => setFormData({...formData, notes: e.target.value})} 
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl transition-all shadow-md">
                    送出登記 (自動記錄到辦公室時間)
                  </button>
                </form>
              </div>

              <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                  <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span className="bg-amber-100 text-amber-600 p-2 rounded-lg"><Icons.Guard /></span>
                    今日待接回名單 ({waitingStudents.length} 人)
                  </h2>
                  <span className="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full flex items-center gap-2">
                    <Icons.Calendar /> {today}
                  </span>
                </div>

                {waitingStudents.length === 0 ? (
                  <div className="p-12 text-center bg-slate-50 rounded-xl border-2 border-dashed border-gray-200">
                    <p className="text-gray-500 font-medium">太棒了！目前沒有等待中的學生。</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
                    {waitingStudents.map(student => (
                      <div key={student.id} className="bg-white p-5 rounded-2xl border-2 border-amber-200 shadow-sm flex flex-col justify-between relative group">
                        <div>
                          <div className="flex justify-between items-start mb-3">
                            <span className="bg-gray-100 text-gray-700 px-3 py-1 rounded-lg text-sm font-black">{student.gradeClass}</span>
                            <div className="flex items-center gap-1">
                              <button onClick={() => setEditingStudent(student)} className="p-1.5 text-gray-400 hover:text-blue-600 rounded-lg hover:bg-blue-50" title="修改資料">✏️</button>
                              <button onClick={() => { if(confirm(`確定要刪除 ${student.studentName} 的記錄嗎？`)) onDelete(student.id); }} className="p-1.5 text-gray-400 hover:text-red-600 rounded-lg hover:bg-red-50" title="刪除記錄">🗑️</button>
                              <span className="text-xs font-bold text-gray-500 flex items-center gap-1 bg-white border px-2 py-1 rounded ml-1">
                                <Icons.Clock /> {student.arrivalTime} 到達
                              </span>
                            </div>
                          </div>
                          <h3 className="text-2xl font-black text-gray-800">{student.studentName}</h3>
                          {student.notes && <p className="text-sm text-amber-800 mt-3 bg-amber-50 px-3 py-2 rounded-lg font-medium">備註: {student.notes}</p>}
                          <p className="text-xs text-gray-400 mt-2">登記單位: {student.createdBy}</p>
                        </div>
                        <button onClick={() => { setSelectedStudent(student); setSignature('爸爸'); setOtherName(''); }} className="w-full mt-5 bg-amber-400 hover:bg-amber-500 text-amber-900 font-bold py-3 rounded-xl flex justify-center items-center gap-2">
                          <Icons.Check /> 確認簽退
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* 簽退彈窗 */}
              {selectedStudent && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in-up">
                  <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl space-y-6">
                    <div className="text-center">
                      <h3 className="text-2xl font-black text-gray-800 mb-2">確認學生接回</h3>
                      <p className="text-gray-500 font-medium">
                        正在簽退：<span className="text-emerald-600 font-bold ml-1">{selectedStudent.gradeClass} - {selectedStudent.studentName}</span>
                      </p>
                    </div>

                    <div className="space-y-3">
                      <label className="block text-sm font-bold text-gray-700">請選擇接送者身分</label>
                      <div className="grid grid-cols-2 gap-3">
                        {['爸爸', '媽媽', '阿公阿嬤', '其他'].map((option) => (
                          <button
                            key={option}
                            type="button"
                            onClick={() => { 
                              setSignature(option); 
                              if (option === '其他') setOtherName(''); // 選擇其他時清空自訂輸入
                            }}
                            className={`py-3 px-4 rounded-xl font-bold border-2 transition-all text-center ${
                              signature === option 
                                ? 'border-amber-500 bg-amber-50 text-amber-900 shadow-sm'
                                : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300'
                            }`}
                          >
                            {option}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* 🔥 功能 2：選擇「其他」時顯示完全空白的輸入框 */}
                    {signature === 'other' || signature === '其他' && (
                      <div className="space-y-2">
                        <label className="block text-sm font-bold text-gray-700">請輸入其他接送者姓名</label>
                        <input
                          type="text"
                          autoFocus
                          className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-amber-400 outline-none text-center font-bold"
                          placeholder="請直接輸入姓名"
                          value={otherName}
                          onChange={(e) => setOtherName(e.target.value)}
                        />
                      </div>
                    )}

                    <div className="flex gap-3 pt-2">
                      <button onClick={() => { setSelectedStudent(null); setSignature(''); setOtherName(''); }} className="flex-1 py-4 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200 transition-colors">
                        取消
                      </button>
                      <button 
                        onClick={() => {
                          const finalSig = (signature === '其他') ? otherName : signature;
                          if (!finalSig.trim()) return;
                          onCheckout(selectedStudent.id, finalSig);
                          setSelectedStudent(null);
                          setSignature('');
                          setOtherName('');
                        }} 
                        disabled={(signature === '其他' && !otherName.trim())} 
                        className="flex-1 py-4 bg-amber-500 text-white font-bold rounded-xl hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-md"
                      >
                        確認送出
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 編輯記錄彈窗 */}
              {editingStudent && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in-up">
                  <form onSubmit={handleSaveEdit} className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                    <h3 className="text-2xl font-black text-center text-gray-800 mb-2">修改學生記錄</h3>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">班級</label>
                      <input type="text" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none" value={editingStudent.gradeClass} onChange={e => setEditingStudent({...editingStudent, gradeClass: e.target.value})} required />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">姓名</label>
                      <input type="text" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none" value={editingStudent.studentName} onChange={e => setEditingStudent({...editingStudent, studentName: e.target.value})} required />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">到辦公室時間</label>
                        <input type="text" placeholder="HH:mm" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none font-mono" value={editingStudent.arrivalTime || ''} onChange={e => setEditingStudent({...editingStudent, arrivalTime: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">離開辦公室時間</label>
                        <input type="text" placeholder="HH:mm" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none font-mono" value={editingStudent.departureTime || ''} onChange={e => setEditingStudent({...editingStudent, departureTime: e.target.value})} />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">備註</label>
                      <input type="text" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none" value={editingStudent.notes} onChange={e => setEditingStudent({...editingStudent, notes: e.target.value})} />
                    </div>
                    <div className="flex gap-3 pt-4">
                      <button type="button" onClick={() => setEditingStudent(null)} className="flex-1 py-4 bg-gray-100 text-gray-600 font-bold rounded-xl">取消</button>
                      <button type="submit" className="flex-1 py-4 bg-blue-600 text-white font-bold rounded-xl">儲存變更</button>
                    </div>
                  </form>
                </div>
              )}
            </div>
          );
        };




        const AdminView = ({ records, onRefresh, onDelete, onUpdate }) => {
          const [startDate, setStartDate] = useState('2020-01-01');
          const [endDate, setEndDate] = useState('2099-12-31');
          const [showGasModal, setShowGasModal] = useState(false);
          const [editingRecord, setEditingRecord] = useState(null);
          const gasUrl = 'https://script.google.com/macros/s/AKfycbxidUn1nAfCp1FRffupl9MEeW7K7WeN1jhRAuBgm1gTlERsBtHFlV-O5rGrRNdibKfR/exec';

          const filteredRecords = records.filter(r => r.date >= startDate && r.date <= endDate);
          const waitingCount = filteredRecords.filter(r => r.status === 'waiting').length;

          const handleSaveEdit = (e) => {
            e.preventDefault();
            onUpdate(editingRecord);
            setEditingRecord(null);
          };

          return (
            <div className="max-w-6xl mx-auto space-y-6 animate-fade-in-up pb-10">
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-center justify-between gap-4">
                <h2 className="text-xl font-black text-gray-800 flex items-center gap-3">
                  <span className="bg-slate-800 text-white p-2 rounded-lg"><Icons.Admin /></span>
                  行政總覽管理
                </h2>
                <div className="flex flex-wrap items-center gap-3">
                  <div className="flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-xl border border-gray-200">
                    <Icons.Calendar />
                    <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="bg-transparent text-sm font-medium outline-none text-gray-700" />
                    <span className="text-gray-400 font-bold">~</span>
                    <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="bg-transparent text-sm font-medium outline-none text-gray-700" />
                  </div>
                  <button onClick={() => setShowGasModal(true)} className="bg-white border-2 border-gray-200 hover:border-slate-800 hover:bg-slate-800 hover:text-white text-gray-700 px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2 shadow-sm">
                    <Icons.Settings /> GAS 連線狀態
                  </button>
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="p-5 border-b border-gray-100 bg-slate-50 flex justify-between items-center">
                  <div>
                    <h2 className="font-bold text-gray-800 text-lg">115-1 均一國小部課後晚接記錄 (區間總表)</h2>
                    <p className="text-xs text-gray-500 mt-1">目前顯示區間共 <strong className="text-slate-800">{filteredRecords.length}</strong> 筆資料，其中尚未接回 <strong className="text-amber-500">{waitingCount}</strong> 筆。</p>
                  </div>
                  <button onClick={onRefresh} className="p-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-100 text-gray-600" title="重新整理資料">
                    <Icons.Clock />
                  </button>
                </div>
                <div className="overflow-x-auto max-h-[600px] hide-scrollbar">
                  <table className="w-full text-left border-collapse whitespace-nowrap">
                    <thead className="sticky top-0 bg-slate-50 z-10 shadow-sm">
                      <tr className="text-gray-500 text-sm font-semibold tracking-wide border-b border-gray-200">
                        <th className="px-6 py-4">日期</th>
                        <th className="px-6 py-4">狀態</th>
                        <th className="px-6 py-4">班級</th>
                        <th className="px-6 py-4">姓名</th>
                        <th className="px-6 py-4">登記單位</th>
                        <th className="px-6 py-4">到辦公室</th>
                        <th className="px-6 py-4">離開辦公室</th>
                        <th className="px-6 py-4">家長簽名</th>
                        <th className="px-6 py-4">備註</th>
                        <th className="px-6 py-4">操作</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {filteredRecords.length === 0 ? (
                         <tr><td colSpan="10" className="p-12 text-center text-gray-400 font-medium">此日期區間無任何記錄。</td></tr>
                      ) : (
                        filteredRecords.sort((a,b) => new Date(b.date) - new Date(a.date)).map(record => (
                          <tr key={record.id} className="hover:bg-slate-50 transition-colors">
                            <td className="px-6 py-4 text-gray-500 font-medium">{record.date}</td>
                            <td className="px-6 py-4">
                              {record.status === 'waiting' 
                                ? <span className="px-3 py-1 bg-amber-100 text-amber-700 text-xs rounded-full font-bold">等待中</span>
                                : <span className="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs rounded-full font-bold">已接回</span>}
                            </td>
                            <td className="px-6 py-4 font-black text-gray-800">{record.gradeClass}</td>
                            <td className="px-6 py-4 font-black text-gray-800 text-lg">{record.studentName}</td>
                            <td className="px-6 py-4 text-gray-400 text-sm font-medium">{record.createdBy}</td>
                            <td className="px-6 py-4 font-mono font-medium text-slate-600">{record.arrivalTime}</td>
                            <td className="px-6 py-4 font-mono font-bold text-slate-800">{record.departureTime || '-'}</td>
                            <td className="px-6 py-4 font-medium text-slate-700">{record.signature || '-'}</td>
                            <td className="px-6 py-4 text-gray-500 max-w-[200px] truncate" title={record.notes}>{record.notes || '-'}</td>
                            <td className="px-6 py-4 space-x-2">
                              <button onClick={() => setEditingRecord(record)} className="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-bold transition-colors">編輯</button>
                              <button onClick={() => { if(confirm(`確定要刪除 ${record.studentName} 的記錄嗎？`)) onDelete(record.id); }} className="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-xs font-bold transition-colors">刪除</button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              {showGasModal && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                  <div className="bg-white rounded-3xl p-8 w-full max-w-lg shadow-2xl">
                    <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 mb-4 mx-auto">
                      <Icons.Settings />
                    </div>
                    <h3 className="text-2xl font-black text-center text-gray-800 mb-4">GAS 連線狀態</h3>
                    <p className="text-sm text-gray-500 mb-6 text-center leading-relaxed">系統已自動與 Google 試算表完成連線。</p>
                    <input type="text" readOnly className="w-full px-4 py-4 border-2 border-gray-200 rounded-xl outline-none font-mono text-sm text-gray-500 bg-gray-100 mb-6" value={gasUrl} />
                    <button onClick={() => setShowGasModal(false)} className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-colors">確定</button>
                  </div>
                </div>
              )}

              {editingRecord && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in-up">
                  <form onSubmit={handleSaveEdit} className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                    <h3 className="text-2xl font-black text-center text-gray-800 mb-2">管理端：修改記錄</h3>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">班級</label>
                      <input type="text" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none" value={editingRecord.gradeClass} onChange={e => setEditingRecord({...editingRecord, gradeClass: e.target.value})} required />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">姓名</label>
                      <input type="text" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none" value={editingRecord.studentName} onChange={e => setEditingRecord({...editingRecord, studentName: e.target.value})} required />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">到辦公室時間</label>
                        <input type="text" placeholder="HH:mm" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none font-mono" value={editingRecord.arrivalTime || ''} onChange={e => setEditingRecord({...editingRecord, arrivalTime: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">離開辦公室時間</label>
                        <input type="text" placeholder="HH:mm" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none font-mono" value={editingRecord.departureTime || ''} onChange={e => setEditingRecord({...editingRecord, departureTime: e.target.value})} />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">備註</label>
                      <input type="text" className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none" value={editingRecord.notes} onChange={e => setEditingRecord({...editingRecord, notes: e.target.value})} />
                    </div>
                    <div className="flex gap-3 pt-4">
                      <button type="button" onClick={() => setEditingRecord(null)} className="flex-1 py-4 bg-gray-100 text-gray-600 font-bold rounded-xl">取消</button>
                      <button type="submit" className="flex-1 py-4 bg-blue-600 text-white font-bold rounded-xl">儲存變更</button>
                    </div>
                  </form>
                </div>
              )}
            </div>
          );
        };

        const App = () => {
          const [role, setRole] = useState(null);
          const [records, setRecords] = useState([]);
          const [toast, setToast] = useState(null);
          const [isLoading, setIsLoading] = useState(false);

          const showToast = (msg) => { setToast(msg); };
          const gasUrl = 'https://script.google.com/macros/s/AKfycbxidUn1nAfCp1FRffupl9MEeW7K7WeN1jhRAuBgm1gTlERsBtHFlV-O5rGrRNdibKfR/exec';

          const fetchRecordsFromGAS = async () => {
            try {
              const res = await fetch(gasUrl, { method: 'GET' });
              const data = await res.json();
              if (data.status === 'success' && Array.isArray(data.data)) {
                setRecords(data.data.reverse());
                showToast('✅ 試算表資料已同步更新');
              }
            } catch (err) {
              console.warn("取得試算表失敗", err);
            }
          };

          useEffect(() => { fetchRecordsFromGAS(); }, []);

          const executeAction = async (actionType, payload, successMsg) => {
            setIsLoading(true);
            try {
              await fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: actionType, data: payload }),
              });
              showToast(successMsg);
              setTimeout(() => { 
                fetchRecordsFromGAS(); 
                setIsLoading(false);
              }, 1500);
            } catch (err) {
              console.error(err);
              showToast('❌ 與試算表連線失敗');
              setIsLoading(false);
            }
          };

          const handleAddRecord = (data, currentRoleTitle) => {
            const newRecord = {
              id: Date.now(),
              date: getTodayDate(),
              gradeClass: data.gradeClass,
              studentName: data.studentName,
              arrivalTime: getCurrentTime(),
              departureTime: '',
              signature: '',
              notes: data.notes,
              status: 'waiting',
              createdBy: currentRoleTitle
            };
            executeAction('add', newRecord, `✅ 已成功送出登記：${data.studentName}`);
          };

          const handleCheckout = (id, parentSignature) => {
            executeAction('checkout', { id, departureTime: getCurrentTime(), signature: parentSignature }, '✅ 簽退送出成功！');
          };

          const handleDelete = (id) => {
            executeAction('delete', { id }, '🗑️ 記錄已刪除');
          };

          const handleUpdate = (updatedRecord) => {
            executeAction('update', updatedRecord, '✏️ 記錄已更新');
          };

          const roleConfig = {
            teacher: { title: '安親老師端', color: 'text-blue-700 bg-blue-100', type: 'operation' },
            office: { title: '辦公室端', color: 'text-purple-700 bg-purple-100', type: 'operation' },
            guard: { title: '警衛室端', color: 'text-amber-700 bg-amber-100', type: 'operation' },
            admin: { title: '行政管理端', color: 'text-white bg-slate-800', type: 'admin' }
          };

          if (!role) {
            return (
              <div className="min-h-screen bg-slate-100 flex flex-col justify-center items-center p-4">
                {isLoading && <LoadingOverlay message="正在與試算表同步資料..." />}
                <div className="max-w-md w-full bg-white rounded-[2rem] shadow-xl p-8 space-y-8 animate-fade-in-up border border-slate-100">
                  <div className="text-center pt-4">
                    <div className="mx-auto flex items-center justify-center mb-6">
                      <img src="https://junyi.tw/sites/default/files/logo--junyi-header-2020--w300@2x.png" alt="Logo" className="max-h-16 object-contain" />
                    </div>
                    <h1 className="text-3xl font-black text-gray-800 tracking-tight">均一國小部晚接記錄系統</h1>
                    <p className="text-gray-400 font-medium mt-3">請選擇您的單位登入</p>
                  </div>
                  
                  <div className="space-y-6">
                    <div>
                      <p className="text-xs font-black text-gray-400 mb-3 uppercase tracking-widest pl-2">一線操作人員 (新增/簽退)</p>
                      <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => setRole('teacher')} className="h-28 flex flex-col items-center justify-center gap-2 bg-white hover:bg-blue-50 text-gray-600 hover:text-blue-600 font-bold rounded-2xl transition-all border-2 border-gray-100 hover:border-blue-200 shadow-sm">
                          <span className="p-2.5 bg-blue-50 rounded-xl"><Icons.Teacher /></span> 安親老師
                        </button>
                        
                        <button onClick={() => setRole('office')} className="h-28 flex flex-col items-center justify-center gap-2 bg-white hover:bg-purple-50 text-gray-600 hover:text-purple-600 font-bold rounded-2xl transition-all border-2 border-gray-100 hover:border-purple-200 shadow-sm">
                          <span className="p-2.5 bg-purple-50 rounded-xl"><Icons.Office /></span> 辦公室
                        </button>
                        
                        <button onClick={() => setRole('guard')} className="col-span-2 h-28 flex flex-col items-center justify-center gap-2 bg-white hover:bg-amber-50 text-gray-600 hover:text-amber-600 font-bold rounded-2xl transition-all border-2 border-gray-100 hover:border-amber-300 shadow-sm">
                          <span className="p-2.5 bg-amber-100 rounded-xl text-amber-700"><Icons.Guard /></span> 警衛室
                        </button>
                      </div>
                    </div>
                    
                    <div className="pt-2">
                      <p className="text-xs font-black text-gray-400 mb-3 uppercase tracking-widest pl-2">主任 / 系統管理</p>
                      <button onClick={() => setRole('admin')} className="w-full flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-900 text-white font-bold py-5 rounded-2xl transition-all shadow-md">
                        <Icons.Admin /> 行政管理端 (查看總表)
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen relative">
              {isLoading && <LoadingOverlay message="正在與試算表同步資料..." />}
              <nav className="bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-200 sticky top-0 z-40">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between h-20 items-center">
                    <div className="flex items-center gap-3">
                      <div className="h-10 flex items-center justify-center">
                        <img src="https://junyi.tw/sites/default/files/logo--junyi-header-2020--w300@2x.png" alt="均一 Logo" className="max-h-10 object-contain" />
                      </div>
                      <span className="font-black text-gray-800 text-xl hidden sm:block tracking-tight">國小部晚接記錄系統</span>
                      <span className={`ml-2 px-4 py-1.5 rounded-full text-sm font-bold shadow-inner ${roleConfig[role].color}`}>
                        {roleConfig[role].title}
                      </span>
                    </div>
                    <button onClick={() => { setRole(null); fetchRecordsFromGAS(); }} className="flex items-center gap-2 px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 hover:text-gray-900 rounded-xl font-bold text-sm transition-colors">
                      <Icons.LogOut /> 回到上一頁
                    </button>
                  </div>
                </div>
              </nav>

              <main className="px-4 py-8 max-w-6xl mx-auto">
                {roleConfig[role].type === 'operation' && (
                  <OperationalView currentRoleTitle={roleConfig[role].title} records={records} onAddRecord={handleAddRecord} onCheckout={handleCheckout} onDelete={handleDelete} onUpdate={handleUpdate} gasUrl={gasUrl} showToast={showToast} />
                )}
                {roleConfig[role].type === 'admin' && (
                  <AdminView records={records} onRefresh={fetchRecordsFromGAS} onDelete={handleDelete} onUpdate={handleUpdate} />
                )}
              </main>

              {toast && <Toast message={toast} onClose={() => setToast(null)} />}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
